<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>نظام عُمان الاستثماري</title>
  
  <!-- ربط ملف الـ Manifest -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- إعدادات التثبيت الفوري كملء الشاشة (Standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="استثمار عُمان">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/ledger.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/512/ledger.png">

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
    html, body {
      width: 100%; height: 100%; height: 100dvh;
      background: #0f172a; display: flex; flex-direction: column;
      justify-content: center; align-items: center; color: #f8fafc;
      overflow: hidden;
    }
    .spinner {
      width: 46px; height: 46px;
      border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: #2563eb; border-radius: 50%;
      animation: spin 0.9s linear infinite; margin-bottom: 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <div style="font-size: 0.95rem; font-weight: 800; color: #38bdf8;">نظام عُمان الاستثماري</div>
  <div style="font-size: 0.75rem; color: #94a3b8; margin-top: 4px;">جاري فتح التطبيق المستقل...</div>

  <script>
    // التوجيه الذكي الفوري لرابط الـ Web App مع الحفاظ على وضع الاستقلال
    const targetAppUrl = "https://script.google.com/macros/s/AKfycbwnsjsfIpGqMiRwxK1tjWY6bobRSXj4uglh4b3uDz2KELZTqT4fL-LDjKIHozNHs9TmCQ/exec";

    // التحقق إذا كان التطبيق مفتوحاً كتطبيق مستقل PWA مسجل مسبقاً
    window.addEventListener('load', function() {
      setTimeout(() => {
        // إذا كان الجوال يدعم فتح الرابط مباشرة أو إعادة التوجيه داخل نافذة التطبيق
        window.location.replace(targetAppUrl);
      }, 500);
    });

    // تسجيل الـ Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    }
  </script>

</body>
</html>
